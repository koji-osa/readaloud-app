name: readaloud_app
description: テキスト読み上げアプリ
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 状態管理
  flutter_riverpod: ^2.5.1
  # ローカルDB
  sqflite: ^2.3.3
  path: ^1.9.0
  # APIキー暗号化保存
  flutter_secure_storage: ^9.2.2
  # TTS（内蔵）
  flutter_tts: ^4.0.2
  # HTTP通信
  dio: ^5.4.3+1
  # Web本文抽出
  html: ^0.15.4
  # Share Intent
  flutter_sharing_intent: ^2.0.2
  # UUID生成
  uuid: ^4.4.0
  # ネットワーク確認
  connectivity_plus: ^6.0.3
  # PDF変換
  # バックグラウンド再生
  audio_service: ^0.18.17
  # 音声フォーカス管理（電話着信時の自動停止）
  audio_session: ^0.1.21
  rxdart: ^0.28.0
  # バックグラウンド再生
  # 音声フォーカス管理（電話着信時の自動停止）
  syncfusion_flutter_pdf: ^26.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
